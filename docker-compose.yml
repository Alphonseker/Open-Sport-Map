services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: open_sport_map_db
    restart: always
    environment:
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: spotter_password
      POSTGRES_DB: open_sport_map
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: